[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e6652598dc3847189609a282128921824d55c10b" }
qtv-vrf = { git = "https://github.com/Quantova/QVRF.git", rev = "3ca5244741516ceb94609434f99548a3d3012f71" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "3e8d8f194f93dad40fed826b021f058e5728f513" }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead056d2dcffc370ea35cd0446ab3921f05b4988" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead056d2dcffc370ea35cd0446ab3921f05b4988" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead056d2dcffc370ea35cd0446ab3921f05b4988" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead056d2dcffc370ea35cd0446ab3921f05b4988" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead056d2dcffc370ea35cd0446ab3921f05b4988" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead056d2dcffc370ea35cd0446ab3921f05b4988" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead056d2dcffc370ea35cd0446ab3921f05b4988" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead056d2dcffc370ea35cd0446ab3921f05b4988" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0749e0ac62fc0f0a3edd9ec86846a4d55d4f1180" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0749e0ac62fc0f0a3edd9ec86846a4d55d4f1180" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0749e0ac62fc0f0a3edd9ec86846a4d55d4f1180" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
