[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "33c7e9395ad23f07019909470d319211213e904f" }
qtv-vrf = { git = "https://github.com/Quantova/QVRF.git", rev = "71afaee7e3c7b1b05c5d6bc192e2656c415ae4f1" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "94213d37df4bee940cac3a0a5468ccca42a125b6" }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "5a5c2230a5489cc0c01be4a096609f382968e03a" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "5a5c2230a5489cc0c01be4a096609f382968e03a" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "5a5c2230a5489cc0c01be4a096609f382968e03a" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "5a5c2230a5489cc0c01be4a096609f382968e03a" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "5a5c2230a5489cc0c01be4a096609f382968e03a" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "5a5c2230a5489cc0c01be4a096609f382968e03a" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "5a5c2230a5489cc0c01be4a096609f382968e03a" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "5a5c2230a5489cc0c01be4a096609f382968e03a" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "abc5773d6557f60e6afe0bf0977892773292e901" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "abc5773d6557f60e6afe0bf0977892773292e901" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "abc5773d6557f60e6afe0bf0977892773292e901" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
