[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4abe71e9fa84a6e670e6d5736d7533c3fd10a3ed" }
qtv-vrf = { git = "https://github.com/Quantova/QVRF.git", rev = "199a004a84827143ed919ec7357f59b1d1d79879" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "faf4870915c3419fa5e350e3257bfffd1074fe1f" }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "0f2bc2d44b31e2882bc4e99de238121080d3660f" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "0f2bc2d44b31e2882bc4e99de238121080d3660f" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "0f2bc2d44b31e2882bc4e99de238121080d3660f" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "0f2bc2d44b31e2882bc4e99de238121080d3660f" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "0f2bc2d44b31e2882bc4e99de238121080d3660f" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "0f2bc2d44b31e2882bc4e99de238121080d3660f" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "0f2bc2d44b31e2882bc4e99de238121080d3660f" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "0f2bc2d44b31e2882bc4e99de238121080d3660f" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0972892e90e4a03a2620a5588715a1cdb658f935" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0972892e90e4a03a2620a5588715a1cdb658f935" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0972892e90e4a03a2620a5588715a1cdb658f935" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
