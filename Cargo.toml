[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "7ac1ed92287e8edf2a96f6cff7f9f19281744a9d" }
qtv-vrf = { git = "https://github.com/Quantova/QVRF.git", rev = "f5ac33de88c971a666fe9796a10cfb29bbdba154" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "1fb2934171a082eb55badf904155cbabaf6ed7fb" }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a59506f0374080e0f900e411dd3c832482ac857c" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a59506f0374080e0f900e411dd3c832482ac857c" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a59506f0374080e0f900e411dd3c832482ac857c" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a59506f0374080e0f900e411dd3c832482ac857c" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a59506f0374080e0f900e411dd3c832482ac857c" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a59506f0374080e0f900e411dd3c832482ac857c" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a59506f0374080e0f900e411dd3c832482ac857c" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a59506f0374080e0f900e411dd3c832482ac857c" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "3d57d5251de1dcb0690c102a3a28678aea33bd6c" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "3d57d5251de1dcb0690c102a3a28678aea33bd6c" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "3d57d5251de1dcb0690c102a3a28678aea33bd6c" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
