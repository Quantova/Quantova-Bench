[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "367547487c9ce07ca36293864308c117865a02ea" }
qtv-vrf = { git = "https://github.com/Quantova/QVRF.git", rev = "5079b7d22a0689cf3bac66fe77267f48f71d7809" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "cd7f2772399eefe803810e84fcbb7feb7aae4397" }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "382183fe217802543e70c96006c0223555575d56" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "382183fe217802543e70c96006c0223555575d56" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "382183fe217802543e70c96006c0223555575d56" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
