[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4d73a36c112b91a6a25a6a876f54cdccb729c7de" }
qtv-vrf = { git = "https://github.com/Quantova/QVRF.git", rev = "dc4f8e526098c89e5fa00050066108d29ea857a2" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "db3c3b557c13bd2389b024cca4a2f747e44db5f9" }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "89843bfdff750e834c45184c2db4c95f8d59f951" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "89843bfdff750e834c45184c2db4c95f8d59f951" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "89843bfdff750e834c45184c2db4c95f8d59f951" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "89843bfdff750e834c45184c2db4c95f8d59f951" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "89843bfdff750e834c45184c2db4c95f8d59f951" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "89843bfdff750e834c45184c2db4c95f8d59f951" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "89843bfdff750e834c45184c2db4c95f8d59f951" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "89843bfdff750e834c45184c2db4c95f8d59f951" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "5fe6e9457613a04009260b9f8ffcbca6465b5009" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "5fe6e9457613a04009260b9f8ffcbca6465b5009" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "5fe6e9457613a04009260b9f8ffcbca6465b5009" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
