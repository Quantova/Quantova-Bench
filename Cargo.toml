[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "367547487c9ce07ca36293864308c117865a02ea" }
qtv-vrf = { git = "https://github.com/Quantova/QVRF.git", rev = "913c9207c1d57ed67c06a44ffdca34a49155adcf" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "f2efa4bb143611a58a94607b8d10fdafc69c372c" }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "8ceac4f6bf15ab64dab8aff5e24b12c70be8001a" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "8ceac4f6bf15ab64dab8aff5e24b12c70be8001a" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "8ceac4f6bf15ab64dab8aff5e24b12c70be8001a" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "8ceac4f6bf15ab64dab8aff5e24b12c70be8001a" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "8ceac4f6bf15ab64dab8aff5e24b12c70be8001a" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "8ceac4f6bf15ab64dab8aff5e24b12c70be8001a" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "8ceac4f6bf15ab64dab8aff5e24b12c70be8001a" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "8ceac4f6bf15ab64dab8aff5e24b12c70be8001a" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "47089aa62a703847291dd1d6ead5c3c1d3c9bdd8" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "47089aa62a703847291dd1d6ead5c3c1d3c9bdd8" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "47089aa62a703847291dd1d6ead5c3c1d3c9bdd8" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
