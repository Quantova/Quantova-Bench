[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "12fefda211c5b7f8a8e9ed60e6a35d880da54c38" }
qtv-vrf = { git = "https://github.com/Quantova/QVRF.git", rev = "7734070198ca09892b90ca8eaf2221243bbe3949" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "f7d82abb13a01039d78dca732660fd6700d7b830" }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "3ed57775e1171f870e0236d8d605e07b6dc03761" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "3ed57775e1171f870e0236d8d605e07b6dc03761" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "3ed57775e1171f870e0236d8d605e07b6dc03761" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "3ed57775e1171f870e0236d8d605e07b6dc03761" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "3ed57775e1171f870e0236d8d605e07b6dc03761" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "3ed57775e1171f870e0236d8d605e07b6dc03761" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "3ed57775e1171f870e0236d8d605e07b6dc03761" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "3ed57775e1171f870e0236d8d605e07b6dc03761" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "96370aeb7bb23e04ee177d3945659e5d53fdf09f" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "96370aeb7bb23e04ee177d3945659e5d53fdf09f" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "96370aeb7bb23e04ee177d3945659e5d53fdf09f" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
