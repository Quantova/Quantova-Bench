[package]
name = "qtv-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Quantova throughput and finality benchmark: it drives a realistic transaction mix through to finality, holds the verifying validator to a server class budget, and reports sustained transactions per second, finality latency, and an evidence based attribution of the bottleneck."
repository = "https://github.com/Quantova/Quantova-Bench"

[[bin]]
name = "qtv-bench"
path = "src/main.rs"

[dependencies]
# The single source of cryptography, used for direct signature and hash timing in
# the attribution and for deterministic seeding of the workload.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "46f70778a505a495adb3a1805620802b380ce465" }

# The register machine that executes every transaction on the verifying path.
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "bf2071260666bbf6779edb7f150d1e7cb2c2491b", features = ["unchecked-programs"] }

# The chain library crates and the node, the mempool to finalized block pipeline.
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "fca2d70dcd5c20a44bd1261dfb02faacba3bfcdd" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "fca2d70dcd5c20a44bd1261dfb02faacba3bfcdd" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "fca2d70dcd5c20a44bd1261dfb02faacba3bfcdd" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "fca2d70dcd5c20a44bd1261dfb02faacba3bfcdd" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "fca2d70dcd5c20a44bd1261dfb02faacba3bfcdd" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "fca2d70dcd5c20a44bd1261dfb02faacba3bfcdd" }
qtv-node = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "fca2d70dcd5c20a44bd1261dfb02faacba3bfcdd" }
qtv-net = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "fca2d70dcd5c20a44bd1261dfb02faacba3bfcdd" }

# The consensus crates, the committee sampler, the attestation, and the finality
# certificate the verifying validator checks.
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fe6d36c335f985358df3eba0774f4094ec2d9c31" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fe6d36c335f985358df3eba0774f4094ec2d9c31" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fe6d36c335f985358df3eba0774f4094ec2d9c31" }

# The verifying path is the whole measurement, so build it the way a release node
# would: full optimization, one codegen unit, and link time optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
